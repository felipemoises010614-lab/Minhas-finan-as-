name: Publicar API na Cloudflare

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Crie o segredo CLOUDFLARE_API_TOKEN no repositório (veja docs/WHATSAPP.md). Publicação pulada."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Publicar Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: api
        run: npx -y wrangler@4 deploy
